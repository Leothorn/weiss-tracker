name: Publish Android test download

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android APK workflow run ID
        required: true
        default: '35427089857'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run_id }}
    steps:
      - name: Verify build and download APK
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$REPOSITORY/actions/runs/$BUILD_RUN" > run.json
          jq -e '.conclusion == "success" and .head_branch == "main" and .path == ".github/workflows/android-apk.yml" and .event == "push"' run.json
          RUN_NUMBER=$(jq -r .run_number run.json)
          gh run download "$BUILD_RUN" --repo "$REPOSITORY" --name "weiss-tracker-android-test-$RUN_NUMBER" --dir apk
          cd apk
          sha256sum --check SHA256SUMS.txt
      - name: Publish downloadable prerelease
        run: |
          set -euo pipefail
          COMMIT=$(jq -r .head_sha run.json)
          TAG="android-test-$BUILD_RUN"
          cat > notes.md <<'NOTES'
          Android test build of Weiss My Progress.

          Download weiss-tracker-android-test.apk below directly on your Android phone and open it to install. Android may ask you to allow installation from your browser.

          Includes the 69-item questionnaire, saved history, domain scores and optional monthly reminders. Use sample answers while testing. This APK uses a public development signing key and is not a production release. Phone testing has not yet been completed.

          Test saving/reopening answers and receiving/tapping reminders with the app closed. SHA256SUMS.txt contains the APK checksum.

          Original app code is free for noncommercial use under PolyForm Noncommercial 1.0.0; the WFIRS-S questionnaire retains its separate copyright.
          NOTES
          gh release create "$TAG" --repo "$REPOSITORY" --target "$COMMIT" --prerelease --title "Android test APK" --notes-file notes.md apk/weiss-tracker-android-test.apk apk/SHA256SUMS.txt
